    <section class="container">
        <header>
            <h4>CREATION DU COMPTE BANCAIRE</h4> </header>
        <form class="form" action="#">
            <div class="input-box">
                <label>Nom complet</label>
                <input required="" placeholder="Entrer votre nom complet " type="text">
            </div>
            <div class="column">
                <div class="input-box">
                  <label>Numéro Telephone </label>
                  <input required="" placeholder="Entrer votre numéro telephone" type="telephone">
                </div>
                <div class="input-box">
                  <label>Date Naissance </label>
                  <input required="" placeholder="Entrer votre  date naissance" type="date">
                </div>
            </div>
            <div class="input-box">
                <label>Email </label>
                <input required="" placeholder="Entrer votre adresse email (exemple: nom.prenom@gmail.com)" type="text">
            </div>
            <div class="gender-box">
              <label>Civilité</label>
              <div class="gender-option">
                <div class="gender">
                  <input  name="gender" id="check-male" type="radio">
                  <label for="check-male">M.</label>
                </div>
                <div class="gender">
                  <input name="gender" id="check-female" type="radio">
                  <label for="check-female">Mme.</label>
                </div>
                <div class="gender">
                    <input name="gender" id="check-female" type="radio">
                    <label for="check-female">Mlle.</label>
                  </div>
              
              </div>
            </div>
            <div class="input-box address">
              <label>Address</label>
              <input required="" placeholder="Entre votre address " type="text">
              <div class="column">
                <div class="select-box">
                  <select>
                    <option hidden="">Pays</option>
                    <option>DZ</option>
                    <option>FR</option>
                    <option>USA</option>
                    <option>UK</option>
                  </select>
                </div>
              <input required="" placeholder="Code postale" type="text">
              </div>
            </div>
            <button>Créer</button>
        </form>
      </section>
