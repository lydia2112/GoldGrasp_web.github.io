<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="image/logo.png">
    <title>GoldGrasp | Login </title>
</head>
<body>
 <div class="wrapper">
    <nav class="nav">
        <div class="nav-logo">
            <p> GOLD GRASP </p>
            
        </div>
        <div class="nav-menu" id="navMenu">
            <ul>
                <li>
                    <a href="#" class="link ">Home</a></li>
               
                <li>
                    <a href="#" class="link">Services</a></li>
                <li>
                    <a href="#" class="link">Contact</a></li>
                <li>
                    <a href="#" class="link">About</a></li>
            </ul>
        </div>
        <div class="nav-button">
            <button  class="btn white-btn" id="loginBtn" onclick="oriente()">Sign In</button>
            
        </div>
        <div class="nav-menu-btn">
            <i class="bx bx-menu" onclick="myMenuFunction()"></i>
        </div>
    </nav>

<!----------------------------- Form box ----------------------------------->    
    <div class="form-box">
        
        <!------------------- login form -------------------------->

        <div class="login-container" id="login">
            <div class="top">
                
                <header>Login</header>
            </div>
            <div class="input-box">
                <input type="text" class="input-field" placeholder="Username or Email">
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" placeholder="Password">
                <i class="bx bx-lock-alt"></i>
            </div>
            <div class="input-box">
                <input type="submit" class="submit" value="Sign In" onclick="login()">
            </div>
            <div class="two-col">
                <div class="one">
                    <input type="checkbox" id="login-check">
                    <label for="login-check"> Remember Me</label>
                </div>
                <div class="two">
                    <label><a href="#">Forgot password?</a></label>
                </div>
            </div>
        </div>

        <!------------------- registration form -------------------------->
        
    </div>
</div>   


<script>

    

    function oriente() {
      
        window.location.href = "login.html";
    }

   

</script>

<script>

    

    function login() {
      
        window.location.href = "charg.html";
    }

   

</script>

</body>
</html>
